name: spa-critic-aggregation

channels:
  - conda-forge
  - defaults

dependencies:
  # The exact Python and scientific-stack versions reported in Appendix D.1.
  - defaults::python=3.9.24
  - pip=25.2
  - setuptools=75.8.2
  - wheel=0.45.1
  - cython=0.29.36
  - numpy=1.26.4
  - scipy=1.13.1
  - h5py=3.10.0

  # Build/runtime support for legacy mujoco-py and D4RL on Linux/WSL2.
  - patchelf=0.19.2
  - glfw=3.5.1
  - glew=2.3.0
  - mesalib=25.0.5
  - c-compiler=1.7.0
  - cxx-compiler=1.7.0
  - gcc=12.4.0
  - gxx=12.4.0
  - libgl-devel=1.7.0
  - libegl-devel=1.7.0
  - libglx-devel=1.7.0

  - pip:
      - -r requirements.txt
